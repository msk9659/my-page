  <title>나의 꿈</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti CDN (축하 폭죽 효과) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts: Jua & Noto Sans KR -->
  <link href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;700;900&amp;display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Jua', 'Noto Sans KR', sans-serif;
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 40%, #0c4a6e 80%, #082f49 100%);
      color: #f0f9ff;
      overflow-x: hidden;
      min-height: 100vh;
      user-select: none;
    }

    /* 3D 카드 뒤집기 스타일 */
    .perspective {
      perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
      cursor: pointer;
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
    }
    .card-back {
      transform: rotateY(180deg);
    }

    /* 물방울 애니메이션 */
    .bubble {
      position: absolute;
      bottom: -50px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5);
      animation: rise 8s infinite ease-in-out;
      pointer-events: none;
    }
    @keyframes rise {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-120vh) scale(1.2);
        opacity: 0;
      }
    }

    /* 헤엄치는 물고기 애니메이션 */
    .swimming-fish {
      position: absolute;
      font-size: 2.5rem;
      pointer-events: none;
      animation: swim 15s linear infinite;
      z-index: 1;
    }
    @keyframes swim {
      0% {
        left: -10%;
        transform: translateY(0) scaleX(1);
      }
      50% {
        transform: translateY(-30px) scaleX(1);
      }
      50.1% {
        transform: translateY(-30px) scaleX(-1);
      }
      100% {
        left: 110%;
        transform: translateY(0) scaleX(-1);
      }
    }

    /* 오션 웨이브 빛 효과 */
    .ocean-light {
      background: radial-gradient(circle, rgba(56,189,248,0.2) 0%, rgba(0,0,0,0) 70%);
      animation: pulse-light 4s infinite alternate ease-in-out;
    }
    @keyframes pulse-light {
      0% { opacity: 0.3; transform: scale(0.9); }
      100% { opacity: 0.8; transform: scale(1.1); }
    }

    /* 흔들리는 애니메이션 */
    .floating {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    
    .shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
      40%, 60% { transform: translate3d(8px, 0, 0); }
    }

    /* 마우스 반짝이 트레일 */
    .sparkle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      background: radial-gradient(circle, #7dd3fc 0%, #38bdf8 60%, rgba(255,255,255,0) 100%);
      transform: translate(-50%, -50%);
      animation: sparkle-fade 0.8s ease-out forwards;
      z-index: 9999;
    }
    @keyframes sparkle-fade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.1) rotate(180deg);
      }
    }
  </style>
